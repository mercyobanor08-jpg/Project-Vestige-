const S={};
S[3]={h:"The girl who named a rover",k:"A twelve-year-old in Connecticut wrote about a woman who told the truth. Her chosen name rolled across Mars.",e:"Who gets to name the things we send into the dark?",n:"NASA/JPL naming release (1995); JPL On a Mission podcast, episode 2; JPL Pathfinder fact sheet.",s:[
["Connecticut, 1995","Valerie Ambroise is twelve. Her parents came to America from Haiti. NASA has opened a contest: choose a heroine, then explain why a robot on Mars should carry her name."],
["The essay","She chooses Sojourner Truth, who escaped slavery and spent her life travelling and speaking out. Sojourner, Valerie writes, “went on many journeys and told many truths.” A rover, she says, could travel to find the truths of Mars."],
["The winner","Thousands of students enter. Hers is picked. The name means traveler, and NASA announces it on the thirtieth anniversary of the first robot flyby of Mars."],
["July 4, 1997","Pathfinder falls onto Mars wrapped in airbags and bounces to a stop. It is exactly 170 years since Sojourner Truth officially gained her freedom. The next day, a rover the size of a microwave oven rolls down a ramp onto the red dirt."],
["Eighty-three days","It was built to last a week. It lasts eighty-three days, crawling less than half an inch a second, nuzzling up to rocks and reading their chemistry. It never strays far from the lander that carries its voice home.","j1"],
["Silence","On September 27, 1997 the last good data arrives. A final signal later carries nothing. NASA keeps listening until March 1998. Nobody knows for sure why the voice stopped."],
["Still there","Somewhere on a plain called Ares Vallis, a lander and a small rover sit in the cold. Every rover since (Spirit, Opportunity, Curiosity, Perseverance) was named by a student too. It started with a girl who believed a machine could carry a person’s hope."]]};
S[4]={h:"The orphan who named Spirit",k:"A nine-year-old who once lived in a Siberian orphanage looked at the stars, and wrote two words that crossed them.",e:"What name would you give something you were sending into the dark?",n:"NASA naming release, June 2003; JPL ‘Girl with dreams names Mars rovers’; NASA Spirit mission page.",s:[
["Siberia","Sofi Collis is born in Siberia and spends her first two years in an orphanage. Then a woman in Scottsdale, Arizona adopts her and brings her to America."],
["Nine years old","In third grade she enters a contest to name two Mars rovers. In fifty words she tells the truth: “I used to live in an orphanage. It was dark and cold and lonely.” At night the sky made her feel better. She dreamed she could fly there."],
["Spirit and Opportunity","In America, she writes, her dreams can come true. Her thank-you is two words: Spirit and Opportunity. Out of ten thousand entries NASA picks hers, and flies her to Florida to watch the first rover leave Earth."],
["January 2004","On the night of January 3 (Pacific time), Spirit bounces twenty-eight times across Gusev crater inside its airbags and stops. It is built to work for ninety days.","m1"],
["The long drive","It keeps going. It climbs a hill. Dust devils sweep its panels clean. A wheel starts to fail, and the dragging wheel digs up bright, silica-rich soil: a clue to ancient hot springs. A broken part becomes a discovery."],
["The trap","On May 1, 2009 its wheels break through soft soil beside a plateau called Home Plate. Winter is coming, and Spirit cannot tilt its panels toward the Sun."],
["The silence","The last message arrives on March 22, 2010. For more than a year, engineers send over thirteen hundred commands into the Martian night. On May 25, 2011, NASA stops."],
["Twenty-five times longer","A girl who once looked up from a cold place wrote a name that left the planet. Spirit worked for more than six years, about twenty-five times its plan, and now rests where it stopped."]]};
S[5]={h:"Goodnight, Opportunity",k:"It was built for ninety days. It lasted fifteen years, and then a dust storm ended it while a room full of people played it a song.",e:"What do we owe the things that work for us until they can’t?",n:"NASA/JPL mission-end statements, Feb 2019; Planetary Society MER update; AP and ABC coverage; NASA Opportunity page.",s:[
["Eagle crater","Opportunity lands on January 24, 2004 (Pacific time) in a small crater on a flat plain called Meridiani. It is guaranteed for ninety Martian days."],
["Fifteen years","The warranty runs out and it keeps rolling. It finds a meteorite lying on the sand. It finds rock that was soaked in water. It drives 45 kilometers, the first marathon anyone has run on another world.","n1"],
["Morning songs","Mission control had a tradition: wake the rover with a song."],
["June 2018","A dust storm the size of a planet blackens the sky over Opportunity. Its solar panels starve. On June 10 it sends one last signal, and then nothing."],
["The words","Journalists put its last data into a sentence that spread around the world: “My battery is low and it’s getting dark.” The rover never wrote that. People needed it anyway."],
["Eight months","The team keeps sending commands for months, hoping a wind will sweep the panels clean. Hundreds of commands go up. Only static comes back."],
["February 12, 2019","About 8 p.m. in Pasadena, the final commands go up while the room plays Billie Holiday’s “I’ll Be Seeing You.” Some people cry. The speakers hold only static."],
["After rovers","The next day NASA declares the mission complete. Project manager John Callas tells the team their lives will now divide into Before Rovers and After Rovers. The rover ended in Perseverance Valley. On October 11, 2026, a newer rover, Perseverance, passed its distance record."]]};
S[10]={h:"A love letter on a golden record",k:"Nine months before launch, NASA asked for a message to the stars. Ann Druyan fell in love, and her brainwaves rode along.",e:"If you could send one minute of yourself to the stars, what would it hold?",n:"Science@NASA, ‘Voyager, the Love Story’ (2011); NASA Voyager pages and blog (Oct 2026); Smithsonian coverage.",s:[
["Six impossible weeks","Less than nine months before launch, NASA asks Carl Sagan for a message for any civilization that might one day find Voyager. His small team has to decide what Earth sounds like."],
["June 1, 1977","In the middle of the rush, Sagan and Ann Druyan, the project’s creative director, share a phone call that changes everything. Without a date or a quiet evening, they have fallen in love."],
["June 3","Two days later, Ann sits in a New York room, wired to machines that record her brain and heartbeat for an hour. She thinks about Earth’s history, about the troubles of civilizations, and about what it feels like to fall in love."],
["One minute","The hour is squeezed into about a minute of sound and pressed into the grooves of a gold-plated disc. It rides beside greetings in 55 languages. The last is a small boy’s: “Hello from the children of planet Earth.” He is Carl’s son, Nick."],
["September 5, 1977","Voyager 1 lifts off. The record is bolted to its side, with instructions for anyone who wants to play it."],
["A dot","On Valentine’s Day 1990, Voyager 1 turns its camera back and photographs Earth from billions of miles away. Sagan names the picture Pale Blue Dot."],
["Today","In 2012 it entered interstellar space. Now NASA turns off its instruments one by one to keep it alive. On November 18, 2026 it reaches one light-day from home: a message sent today takes a full day to arrive."],
["Still playing","Carl and Ann married in 1981 and stayed together until he died in 1996. Somewhere past the edge of the Sun, an hour of a young woman’s heart goes on travelling at about 38,000 miles an hour."]]};
S[1]={h:"The keys left in the dust",k:"Two commanders, two rovers, two secret promises to people they loved and lost.",e:"What would you leave behind for the next person?",n:"NASA MSFC rover history; NASA Apollo 15 mission accounts; AP obituary of Eugene Cernan (2017).",s:[
["Hadley, August 1971","At the end of their last moonwalk, Dave Scott and Jim Irwin park their rover where its TV camera can watch their liftoff.","l2"],
["A secret","Behind the rover, off camera, Scott lays a tiny aluminum figure of a fallen astronaut and a plaque with fourteen names: American astronauts and Soviet cosmonauts who died reaching for the sky. He has told no one at NASA. He photographs it, then climbs home.","l1"],
["Taurus-Littrow, December 14, 1972","Gene Cernan, the last of twelve people to walk on the Moon, is about to climb the ladder for the final time.","l3"],
["Three letters","He kneels and traces three letters in the dust: TDC. They are the initials of his daughter, Tracy, who is nine. He imagines someone far in the future finding the rover and footprints and wondering what ancient civilization left these marks.","l3"],
["Goodbye","His rover’s camera is set to watch him leave. His last words on the Moon ask that humanity return “with peace and hope for all mankind.”","l5"],
["Three valleys","Three rovers carried three crews farther than any walker could go. They stand in three valleys now, their tracks still visible from orbit, with no wind or rain to wipe them out.","l4"]]};
S[2]={h:"The night the Moon rang like a bell",k:"The astronauts left, and five little stations stayed to listen to a world.",e:"Who is still listening?",n:"NASA Apollo Flight Journal; NASA ALSEP termination report (RP-1036); NASA InSight release (April 2019).",s:[
["Apollo 12, 1969","The astronauts have gone home. Houston sends the empty lunar module crashing into the Moon on purpose, about 39 nautical miles from the seismometer they left behind.","a3"],
["Fifty-five minutes","The seismometer feels it for some 55 minutes. The Moon rings like a bell. On Earth, a rumble like that would fade in about a minute.","a2"],
["Five stations","Over three years, five stations are set up. Each one is a small camp of instruments powered by a plutonium generator. They listen for moonquakes, meteoroid hits, and heat leaking from deep inside.","a5"],
["Built for a year","They were designed to run for a year or two. They run for up to eight. They show the Moon is not a dead rock.","a4"],
["September 30, 1977","NASA stops commanding the stations. They did not fail. The money was needed elsewhere. They are still there.","a1"],
["The handoff","In 2019 a lander on Mars, InSight, hears its first marsquake. Its lead scientist says the readings carry on the science that began with the Apollo missions."]]};
S[6]={h:"The robot that waited for visitors",k:"It slept alone on the Moon for two and a half years. Then two men walked over to say hello.",e:"What would you say to a machine that waited for you?",n:"NASA Science (Surveyor 3); NASA Apollo Lunar Surface Journal; Alan Bean Gallery; TIME (1969).",s:[
["April 1967","Surveyor 3 bounces twice and settles on a slope inside a small crater. It sends back thousands of pictures and digs trenches to learn if the Moon can hold a human spacecraft.","s1"],
["The night","On May 4, 1967 comes its last contact. Lunar night closes over it, and it never answers again."],
["Pete’s parking lot","Thirty-one months later, Pete Conrad aims Apollo 12 at that very crater. The lander touches down just 180 meters away. “Right down the middle of the road,” he says.","s2"],
["An old friend","Conrad and Bean walk over like visitors to an old friend. Bean would later paint the moment, and call the series Visiting an Old Friend.","s3"],
["An afterthought","They cut off its TV camera and cables. The scoop comes last; it was not even on the list. NASA wanted to know what thirty-one months on the Moon had done to materials.","s1"],
["Still there","The rest of Surveyor 3 stays. In the photo, Conrad stands beside it with his own lander behind him: two machines from two eras, side by side.","s2"]]};
S[7]={h:"The memorial in the red dust",k:"The man who built Mars’s first camera died on a mountain. His name stayed on the lander.",e:"Who will carry the plaque?",n:"NASA Science (Viking 1); NASA Photojournal PIA08709 (Mutch Crater); JPL (1983).",s:[
["July 20, 1976","Viking 1 lands in Chryse Planitia and takes the first photograph from the surface of Mars. Tim Mutch leads the team that designed the cameras and reads those first pictures."],
["Two worlds","Mutch is a geologist, and a climber. He has already explored the Moon in books and mountains on Earth. In 1978 he leads a team of students up a 21,900-foot Himalayan peak; twenty-four reach the top."],
["October 1980","On the slopes of Mount Nun in the Himalayas, descending from the summit, Tim Mutch dies. He is 49, and on leave from his university to serve as NASA’s head of space science."],
["A new name","Afterward, NASA renames the Viking 1 lander the Thomas A. Mutch Memorial Station."],
["A plaque for Mars","A stainless-steel plaque honors his “imagination, verve, and resolve.” It is meant to be placed on the lander someday by a team of explorers."],
["Silence","The lander works for six years. On November 11, 1982, a faulty command from Earth ends contact. JPL gives up the search in April 1983."],
["Waiting","The lander still sits on the Golden Plain with its new name. A crater on Mars is called Mutch too, and the plaque still waits for someone to carry it."]]};
S[8]={h:"Thirty years of listening",k:"A scientist spent decades waiting to hear one quake on Mars. Then dust slowly turned the lights off.",e:"What would you listen to for thirty years?",n:"NASA/JPL InSight pages; National Geographic (April 2019); Space.com; CBS and CNN (Dec 2022).",s:[
["The 1980s","Bruce Banerdt starts dreaming of a seismometer on Mars. For about thirty years, he says, he has been chasing a single marsquake."],
["November 2018","InSight lands on a smooth plain called Elysium Planitia and, weeks later, sets its seismometer gently on the ground."],
["Nothing","For months it hears only wind and its own lander. Banerdt jokes that he started not answering NASA’s phone calls."],
["April 6, 2019","On the 128th Martian day, a faint tremble arrives, the first from the inside of another world. “A sigh of relief went up from the team,” Banerdt recalls."],
["The mole","A German heat probe tries to hammer itself into the ground. The soil is too loose for it to grip. For nearly two years the team tries everything. Banerdt later calls it a bust."],
["May 4, 2022","The biggest quake of the entire mission hits, a magnitude 5, just before the lander switches off instruments to save power. The team feels lucky."],
["Dust","Dust gathers on the solar panels. Instruments go dark one by one. Its social-media account, written by its team in its voice, says its time “has been both productive and serene.”"],
["A friend on Mars","For four years, Banerdt says, the team thought of InSight as their friend and colleague on Mars. It heard more than 1,300 quakes."]]};
S[9]={h:"A message for strangers",k:"A machine built for twenty-one months carried a drawing of two humans out of the solar system.",e:"What would you tell a stranger?",n:"NASA Science (Pioneer 10); NASA Ames press release (Feb 2003); NASA Pioneer facts; New Humanist (plaque anecdote).",s:[
["A few weeks","Carl Sagan and Frank Drake have only a short time to design a greeting for Pioneer 10. What do you say to someone you may never meet?"],
["Linda’s drawing","The artist Linda Salzman Sagan draws the figures: a man and a woman beside the spacecraft, to show scale. Reportedly she first drew them holding hands, then worried a stranger might see one creature."],
["March 1972","Pioneer 10 leaves Earth on a mission planned for twenty-one months."],
["Jupiter","In December 1973 it becomes the first spacecraft to fly past Jupiter, through radiation that damages its instruments, and sends back hundreds of pictures."],
["Leaving","In 1983 it becomes the first human-made object to cross Neptune’s orbit. It keeps going, toward the red star Aldebaran."],
["The warranty","Its project manager, Larry Lasher, calls it “a workhorse that far exceeded its warranty.” It lasts more than thirty years."],
["January 2003","Its last weak signal comes from 7.6 billion miles away. It takes 11 hours and 20 minutes to reach Earth. The voice we heard was already half a day old."],
["Still carrying","A final attempt in 2006 hears nothing. The plaque keeps going: a man, a woman, and a map to home, headed for a star about two million years away."]]};
